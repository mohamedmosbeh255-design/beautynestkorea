<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="PDRN Salmon DNA cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef6f3"/>
      <stop offset="0.55" stop-color="#fdeae3"/>
      <stop offset="1" stop-color="#fbd5c8"/>
    </linearGradient>
    <linearGradient id="dropFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f7b5a1" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="180" cy="80" r="170" fill="#ffffff" opacity="0.3"/>
  <circle cx="1060" cy="560" r="150" fill="#ffffff" opacity="0.25"/>

  <!-- DNA helix line-art -->
  <g transform="translate(830,315)" stroke="#d55135" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M-70,-190 C70,-120 -70,-60 70,10 C-70,80 70,140 -70,190" opacity="0.95"/>
    <path d="M70,-190 C-70,-120 70,-60 -70,10 C70,80 -70,140 70,190" opacity="0.55"/>
    <g stroke-width="4" opacity="0.7">
      <line x1="-48" y1="-150" x2="48" y2="-150"/>
      <line x1="-8" y1="-100" x2="8" y2="-100"/>
      <line x1="-52" y1="-50" x2="52" y2="-50"/>
      <line x1="-8" y1="0" x2="8" y2="0"/>
      <line x1="-52" y1="50" x2="52" y2="50"/>
      <line x1="-8" y1="100" x2="8" y2="100"/>
      <line x1="-48" y1="150" x2="48" y2="150"/>
    </g>
    <circle cx="-70" cy="-190" r="10" fill="#e96a4d" stroke="none"/>
    <circle cx="70" cy="190" r="10" fill="#e96a4d" stroke="none"/>
  </g>

  <!-- Hydration droplet -->
  <g transform="translate(1010,140)">
    <path d="M0,-52 C26,-12 44,12 44,40 A44,44 0 1 1 -44,40 C-44,12 -26,-12 0,-52 Z"
      fill="url(#dropFill)" stroke="#d55135" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-16,44 A28,28 0 0 0 12,48" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <g font-family="Georgia, 'Playfair Display', serif">
    <text x="100" y="230" font-family="Arial, Helvetica, sans-serif" font-size="28" letter-spacing="8" fill="#e96a4d">INGREDIENT SPOTLIGHT</text>
    <text x="96" y="330" font-size="96" font-weight="bold" fill="#2b2b2e">PDRN:</text>
    <text x="96" y="430" font-size="72" font-weight="bold" fill="#2b2b2e">Salmon DNA</text>
    <rect x="100" y="468" width="120" height="6" rx="3" fill="#e96a4d"/>
    <text x="100" y="518" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#8a4a38">Repair, elasticity and glass-skin glow</text>
  </g>
</svg>
