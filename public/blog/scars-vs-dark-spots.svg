<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Scars vs Dark Spots cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7e8d8"/>
      <stop offset="0.5" stop-color="#f3ddc8"/>
      <stop offset="1" stop-color="#e8c8ae"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="150" cy="90" r="160" fill="#ffffff" opacity="0.3"/>
  <circle cx="1080" cy="560" r="150" fill="#ffffff" opacity="0.25"/>

  <!-- LEFT: smooth, even skin-tone dots -->
  <g fill="#b98a5e" opacity="0.55">
    <g>
      <circle cx="690" cy="140" r="9"/><circle cx="740" cy="140" r="9"/><circle cx="790" cy="140" r="9"/><circle cx="840" cy="140" r="9"/>
      <circle cx="690" cy="190" r="9"/><circle cx="740" cy="190" r="9"/><circle cx="790" cy="190" r="9"/><circle cx="840" cy="190" r="9"/>
      <circle cx="690" cy="240" r="9"/><circle cx="740" cy="240" r="9"/><circle cx="790" cy="240" r="9"/><circle cx="840" cy="240" r="9"/>
      <circle cx="690" cy="290" r="9"/><circle cx="740" cy="290" r="9"/><circle cx="790" cy="290" r="9"/><circle cx="840" cy="290" r="9"/>
      <circle cx="690" cy="340" r="9"/><circle cx="740" cy="340" r="9"/><circle cx="790" cy="340" r="9"/><circle cx="840" cy="340" r="9"/>
      <circle cx="690" cy="390" r="9"/><circle cx="740" cy="390" r="9"/><circle cx="790" cy="390" r="9"/><circle cx="840" cy="390" r="9"/>
      <circle cx="690" cy="440" r="9"/><circle cx="740" cy="440" r="9"/><circle cx="790" cy="440" r="9"/><circle cx="840" cy="440" r="9"/>
      <circle cx="690" cy="490" r="9"/><circle cx="740" cy="490" r="9"/><circle cx="790" cy="490" r="9"/><circle cx="840" cy="490" r="9"/>
    </g>
  </g>
  <text x="765" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="6" fill="#8a5a34">SMOOTH TONE</text>

  <!-- RIGHT: textured, irregular scar lines -->
  <g fill="none" stroke="#7c4a2d" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <path d="M930,120 C960,150 920,180 950,210 C980,240 940,270 970,300"/>
    <path d="M990,130 C1010,170 975,200 1000,240 C1025,280 990,310 1010,350"/>
    <path d="M1050,120 C1075,160 1040,190 1065,230 C1090,270 1050,300 1075,340"/>
    <path d="M935,370 C965,400 930,430 960,460 C985,485 950,510 970,530"/>
    <path d="M1000,390 C1025,420 990,450 1015,480 C1035,505 1005,520 1020,540"/>
    <path d="M1055,380 C1080,415 1045,445 1070,480 C1090,505 1060,525 1075,545"/>
  </g>
  <g fill="#7c4a2d" opacity="0.5">
    <circle cx="950" cy="330" r="7"/><circle cx="1040" cy="260" r="6"/><circle cx="995" cy="500" r="7"/><circle cx="1060" cy="505" r="5"/>
  </g>
  <text x="1000" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="6" fill="#7c4a2d">TEXTURED SCARS</text>

  <!-- Soft divider between halves -->
  <rect x="883" y="60" width="4" height="440" fill="url(#divider)"/>

  <!-- Text -->
  <g font-family="Georgia, 'Playfair Display', serif">
    <text x="100" y="200" font-family="Arial, Helvetica, sans-serif" font-size="28" letter-spacing="8" fill="#a06a3c">K-BEAUTY GUIDE</text>
    <text x="96" y="300" font-size="88" font-weight="bold" fill="#3d2b1f">Scars vs</text>
    <text x="96" y="400" font-size="88" font-weight="bold" fill="#3d2b1f">Dark Spots</text>
    <rect x="100" y="438" width="120" height="6" rx="3" fill="#a06a3c"/>
    <text x="100" y="488" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#7c5a3c">Texture or color? How to tell them apart</text>
  </g>
</svg>
